    <script>
        
        const fetchArtists = async () => {
            const response = await fetch('./assets/js/members.json');
            const members = await response.json();
            return members;
        };
        async function buildPage(){
            const queryString = window.location.search;
            if(queryString){
                const params = new URLSearchParams(queryString);
                const id = params.get('id');
                const members = await fetchArtists();
                
                const artist = members.find(item => item.id == id)
                buildArtist(artist);
            }
        }
        const buildArtist = (artist) => {
            $("#artist-profile").html("");
            $("#artist-bio").html("");
            $("#artist-profile").append(`
                        <div class="outer">
                            <div class="inner">
                                <div class="container px-4 px-md-0">
                                    <div class="row">
                                        <div class="col-xl-6">
                                            <div class="artist-info">
                                                <span>${artist.tag}</span>
                                                <div class="spacer-15"></div>
                                                <h2>${artist.first_name} <br> ${artist.last_name}</h2>
                                                <div class="spacer-30"></div>
                                                <div class="social-links">
                                                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                                                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                                                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                                                    <a href="#"><i class="fa-brands fa-tiktok"></i></a>
                                                </div>
                                                <div class="spacer-60"></div>
                                                </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="image" style="background-image: url(assets/images/members/${artist.last_name}/bg.jpg);"></div>`
                    );
            $("#artist-bio").append(`
                        <div class="container px-4 px-md-0">
                            <h4>Biogpraphy</h4>
                            <div class="spacer-30"></div>
                            <p class="body-two">Beyoncé, in full Beyoncé Giselle Knowles, (born September 4, 1981, Houston, Texas, U.S.), American singer-songwriter and actress who achieved fame in the late 1990s as the lead singer of the R&B group Destiny’s Child and then launched a hugely successful solo career.
                            <br><br>
                            At age nine Beyoncé formed the singing-rapping girl group Destiny’s Child (originally called Girl’s Tyme) in 1990 with childhood friends. In 1992 the group lost on the Star Search television talent show, and three years later it was dropped from a recording contract before an album had been released. In 1997 Destiny’s Child’s fortunes reversed with a Columbia recording contract and then an eponymous debut album that yielded the hit single “No, No, No Part 2.” Their follow-up album, The Writing’s on the Wall (1999), earned the group two Grammy Awards and sold more than eight million copies in the United States. Survivor (2001), the group’s third album, reached the number one spot on the Billboard 200 chart.</p>
                            <div class="spacer-60"></div>
                            <h5>New Melody</h5>
                            <div class="spacer-30"></div>
                            <p class="body-two">At age nine Beyoncé formed the singing-rapping girl group Destiny’s Child (originally called Girl’s Tyme) in 1990 with childhood friends. In 1992 the group lost on the Star Search television talent show, and three years later it was dropped from a recording contract before an album had been released. In 1997 Destiny’s Child’s fortunes reversed with a Columbia recording contract and then an eponymous debut album that yielded the hit single “No, No, No Part 2.” Their follow-up album, The Writing’s on the Wall (1999), earned the group two Grammy Awards and sold more than eight million copies in the United States. Survivor (2001), the group’s third album, reached the number one spot on the Billboard 200 chart.</p>
                        </div>`
                    )
        };
        var oldHref = document.location.href;

        window.onload = function() {
            var bodyList = document.querySelector("body")

            var observer = new MutationObserver(function(mutations) {
                if (oldHref != document.location.href) {
                    oldHref = document.location.href;
                    buildPage()
                }
            });
            
            var config = {
                childList: true,
                subtree: true
            };
            
            observer.observe(bodyList, config);
        };
        buildPage()
    </script>
